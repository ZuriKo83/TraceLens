<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TraceLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="hero">
      <div><span class="kicker">MY ACTIVITY</span><h1>내 활동 조회</h1><p>여러 사이트에서 작성한 게시글과 댓글을 찾아 TraceLens 보관함에 정리합니다.</p></div>
      <button id="open-dashboard" class="icon-button" title="내 활동 열기">↗</button>
    </header>

    <section class="connection-card">
      <div class="section-title">
        <div><span class="step">1</span><h2>로그인 확인</h2></div>
        <span id="connection-state" class="state"><i></i>확인 중</span>
      </div>
      <div id="connected-user" class="explain-box"><b>자동 연결</b><span>TraceLens에 로그인하면 현재 계정으로 자동 연결됩니다.</span></div>
      <button id="open-login" class="secondary full">TraceLens 로그인</button>
    </section>

    <section id="scan-wrap" hidden>
      <div class="section-title">
        <div><span class="step">2</span><h2>조회할 사이트 선택</h2></div>
        <span id="selection-count" class="count">0개 선택</span>
      </div>
      <div class="explain-box"><b>내 활동만 확인</b><span>선택한 사이트에서 현재 로그인한 계정의 게시글과 댓글을 확인합니다.</span></div>
      <div class="select-actions">
        <button id="select-all" type="button">전체 선택</button>
        <button id="select-default" type="button">기본 선택</button>
        <button id="clear-sites" type="button">선택 해제</button>
      </div>
      <div id="site-options" class="site-grid global-site-grid"></div>
      <button id="scan-sites" class="primary">선택한 사이트 조회</button>
    </section>

    <section id="manual-card" class="manual-card" hidden>
      <div class="section-title"><div><span class="step">3</span><h2>현재 페이지 확인</h2></div></div>
      <p>지원 목록에 없는 사이트는 <b>내가 작성한 글이나 댓글 목록</b>을 연 뒤 실행하세요.</p>
      <button id="capture-current" class="secondary full">현재 페이지 확인</button>
    </section>

    <div class="log-wrap">
      <div class="log-head"><strong>진행 상태</strong><button id="clear-log" type="button">지우기</button></div>
      <pre id="log" aria-live="polite">로그인 상태를 확인하고 있습니다.</pre>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>

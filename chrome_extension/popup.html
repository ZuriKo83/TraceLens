<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TraceLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="hero">
      <div><span class="kicker">PERSONAL ACTIVITY SEARCH</span><h1>내 활동 조회</h1><p>웹 앱에 로그인한 사용자 보관함으로 결과를 전송합니다.</p></div>
      <button id="open-dashboard" class="icon-button" title="대시보드 열기">↗</button>
    </header>

    <section class="connection-card">
      <div class="section-title">
        <div><span class="step">1</span><h2>사용자 연결</h2></div>
        <span id="connection-state" class="state"><i></i>확인 중</span>
      </div>
      <div id="connected-user" class="explain-box"><b>자동 연결</b><span>TraceLens 대시보드에 로그인하면 확장 프로그램이 자동으로 연결됩니다.</span></div>
      <button id="open-login" class="secondary full">웹 앱 로그인·연결</button>
    </section>

    <section id="scan-wrap" hidden>
      <div class="section-title">
        <div><span class="step">2</span><h2>사이트 선택</h2></div>
        <span id="selection-count" class="count">0개 선택</span>
      </div>
      <div class="explain-box"><b>내 기록만</b><span>각 사이트의 본인 활동 페이지를 열어 게시글·댓글만 조회합니다.</span></div>
      <div class="select-actions">
        <button id="select-all" type="button">전체 선택</button>
        <button id="select-default" type="button">기본 선택</button>
        <button id="clear-sites" type="button">선택 해제</button>
      </div>
      <div id="site-options" class="site-grid global-site-grid"></div>
      <button id="scan-sites" class="primary">선택 사이트 조회 시작</button>
    </section>

    <section id="manual-card" class="manual-card" hidden>
      <div class="section-title"><div><span class="step">3</span><h2>기타 사이트</h2></div></div>
      <p>지원 목록에 없는 커뮤니티는 <b>내가 쓴 글·댓글 목록</b>을 직접 연 뒤 실행하세요.</p>
      <button id="capture-current" class="secondary full">현재 페이지 가져오기</button>
    </section>

    <div class="log-wrap">
      <div class="log-head"><strong>실행 결과</strong><button id="clear-log" type="button">지우기</button></div>
      <pre id="log" aria-live="polite">웹 앱 로그인 상태를 확인하고 있습니다.</pre>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>

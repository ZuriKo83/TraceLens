name: Local collector

on:
  push:
    branches: [local-docker-development]
  pull_request:
    paths:
      - 'local_collector/**'
      - 'chrome_extension/**'
      - '.github/workflows/local-collector.yml'

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local_collector/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail --silent http://localhost:8021/health
      - run: docker compose exec -T web pytest -q tests/test_web.py tests/test_collector_replace.py tests/test_session_identity.py tests/test_pc_youtube_delete.py tests/test_naver_blog_owner.py -k "dashboard_uses_pc_collector or replacement or session_identity or pc_youtube_delete or naver_blog_owner"
      - if: always()
        run: docker compose logs --tail=120 web worker && docker compose down -v

name: Community checks

on:
  pull_request:
    paths:
      - 'app/community.py'
      - 'app/community_models.py'
      - 'app/redis_session.py'
      - 'app/templates/base.html'
      - 'app/templates/community/**'
      - 'scripts/validate_community.py'
      - '.github/workflows/community-check.yml'
  push:
    branches:
      - feature/community
    paths:
      - 'app/community.py'
      - 'app/community_models.py'
      - 'app/redis_session.py'
      - 'app/templates/base.html'
      - 'app/templates/community/**'
      - 'scripts/validate_community.py'
      - '.github/workflows/community-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jinja2
      - name: Validate Python and templates
        run: python scripts/validate_community.py

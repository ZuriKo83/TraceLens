name: Community checks

on:
  pull_request:
    paths:
      - 'app/account_admin.py'
      - 'app/account_admin_hardened.py'
      - 'app/chat_redis.py'
      - 'app/community.py'
      - 'app/community_admin.py'
      - 'app/community_models.py'
      - 'app/community_ops.py'
      - 'app/community_schema.py'
      - 'app/redis_session.py'
      - 'app/supported_sites.py'
      - 'app/templates/**'
      - 'alembic.ini'
      - 'alembic/**'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/community-check.yml'
  push:
    branches:
      - feature/community
    paths:
      - 'app/account_admin.py'
      - 'app/account_admin_hardened.py'
      - 'app/chat_redis.py'
      - 'app/community.py'
      - 'app/community_admin.py'
      - 'app/community_models.py'
      - 'app/community_ops.py'
      - 'app/community_schema.py'
      - 'app/redis_session.py'
      - 'app/supported_sites.py'
      - 'app/templates/**'
      - 'alembic.ini'
      - 'alembic/**'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/community-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jinja2 alembic sqlalchemy pydantic-settings
      - name: Validate Python and templates
        run: python scripts/validate_community.py
      - name: Compile migration files
        run: python -m compileall -q app alembic scripts

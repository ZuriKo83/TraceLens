name: Windows PC collector

on:
  push:
    branches: [local-docker-development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local_collector/package-lock.json
      - run: npm ci --omit=dev
        working-directory: local_collector
      - name: Bundle Node runtime and collector
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/TraceLens-PC/runtime,dist/TraceLens-PC/local_collector | Out-Null
          Copy-Item (Get-Command node).Source dist/TraceLens-PC/runtime/node.exe
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /out:dist\TraceLens-PC\TraceLens-PC.exe installer\CollectorLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item local_collector/index.mjs,local_collector/controller.mjs,local_collector/adapter.mjs,local_collector/cdp.mjs,local_collector/policy.mjs,local_collector/google_login.mjs,local_collector/site_status.mjs dist/TraceLens-PC/local_collector/
          Copy-Item local_collector/node_modules dist/TraceLens-PC/local_collector/ -Recurse
          New-Item -ItemType Directory -Force -Path dist/TraceLens-PC/chrome_extension | Out-Null
          Copy-Item chrome_extension/background.js,chrome_extension/youtube_delete_page.js,chrome_extension/youtube_activity_collector.js dist/TraceLens-PC/chrome_extension/
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler was not found.' }
          & $compiler installer/TraceLens-PC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify silent installation
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'TraceLens-PC'
          $process = Start-Process -FilePath dist/TraceLens-PC-Setup.exe -ArgumentList '/VERYSILENT', '/NORESTART', "/DIR=`"$target`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$target\runtime\node.exe")) { throw 'Node runtime is missing.' }
          if (-not (Test-Path "$target\TraceLens-PC.exe")) { throw 'Collector launcher is missing.' }
          $launcher = [IO.File]::ReadAllBytes("$target\TraceLens-PC.exe")
          $peOffset = [BitConverter]::ToInt32($launcher, 0x3c)
          if ([BitConverter]::ToUInt16($launcher, $peOffset + 24 + 68) -ne 2) { throw 'Collector launcher must use the Windows GUI subsystem.' }
          if (-not (Test-Path "$target\local_collector\index.mjs")) { throw 'Managed browser entry point is missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: TraceLens-PC-Setup
          path: dist/TraceLens-PC-Setup.exe
      - name: Create direct download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view pc-collector --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload pc-collector dist/TraceLens-PC-Setup.exe --clobber --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit pc-collector --notes "Windows PC collector build: $env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $legacy = gh release view pc-collector --json assets --jq '.assets[].name' --repo "$env:GITHUB_REPOSITORY"
            if ($legacy -contains 'TraceLens-PC-Windows.zip') {
              gh release delete-asset pc-collector TraceLens-PC-Windows.zip --yes --repo "$env:GITHUB_REPOSITORY"
            }
          } else {
            gh release create pc-collector dist/TraceLens-PC-Setup.exe --target "$env:GITHUB_SHA" --title "TraceLens PC collector" --notes "Windows PC collector build: $env:GITHUB_SHA" --latest=false --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

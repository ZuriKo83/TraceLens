<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/icon128.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{% if session_user %}/app{% else %}/{% endif %}">
      <img class="brand-mark" src="{{ url_for('static', path='icons/icon32.png') }}" alt="" width="30" height="30"><span>{{ app_name }}</span>
    </a>
    <nav>
      {% if session_user %}
        <a href="/app">내 활동</a>
        <a href="/supported-sites">지원 사이트</a>
        <a href="/privacy">개인정보처리방침</a>
        <a href="/community">커뮤니티</a>
        <a href="/app/account">계정</a>
        {% if session_user.is_admin %}<a href="/admin">관리자</a>{% endif %}
        <form method="post" action="/logout" class="nav-form">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <button type="submit" class="nav-button">로그아웃</button>
        </form>
      {% else %}
        <a href="/supported-sites">지원 사이트</a>
        <a href="/privacy">개인정보처리방침</a>
        <a class="nav-login" href="/login">로그인</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="site-footer"><span>© 2026 TraceLens</span><a href="/privacy">개인정보처리방침</a><a href="mailto:support@tracelens.kr">문의</a></footer>
{% block scripts %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block title %}관리자 승인 재가입 · {{ app_name }}{% endblock %}
{% block head_extra %}<style>.wrap{max-width:560px;margin:0 auto;padding:48px 0 70px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:28px}.field{margin-top:16px}.field label{display:block;margin-bottom:7px;font-weight:700}.field input{width:100%;height:44px;box-sizing:border-box;border:1px solid #d7dce5;border-radius:10px;padding:0 12px}.btn{width:100%;height:46px;margin-top:22px;border:0;border-radius:11px;background:#4f46c8;color:#fff;font-weight:750}.error{padding:12px 14px;background:#fff1f1;color:#b42318;border-radius:10px}.muted{color:#667085}</style>{% endblock %}
{% block content %}<section class="wrap"><div class="card"><h1>관리자 승인 재가입</h1><p class="muted">관리자에게 전달받은 6자리 인증번호를 입력하세요. 코드는 생성 후 5분 동안만 유효합니다.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="field"><label>이메일</label><input type="email" name="email" value="{{ email or '' }}" required></div><div class="field"><label>관리자 승인 코드</label><input name="code" inputmode="numeric" minlength="6" maxlength="6" required></div><div class="field"><label>새 비밀번호</label><input type="password" name="password" minlength="10" required></div><div class="field"><label>비밀번호 확인</label><input type="password" name="password_confirm" minlength="10" required></div><button class="btn" type="submit">승인 후 재가입</button></form></div></section>{% endblock %}

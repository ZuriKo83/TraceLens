{% extends "base.html" %}
{% block title %}{{ site_label }} 연결 · {{ app_name }}{% endblock %}
{% block content %}
<section class="card browser-card">
  <div class="browser-heading">
    <div><h1>{{ site_label }} 연결</h1><p id="browser-message" role="status">사이트를 여는 중입니다…</p></div>
    <a class="button secondary" href="/app">대시보드로 돌아가기</a>
  </div>
  <div id="browser-viewport" class="browser-viewport">
    <img id="browser-screen" alt="{{ site_label }} 사이트 화면" tabindex="0" hidden>
    <span id="browser-cursor" aria-hidden="true"></span>
    <textarea id="browser-keyboard" aria-label="사이트 화면 키보드 입력" autocomplete="off" autocapitalize="off" spellcheck="false"
      style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;resize:none"></textarea>
  </div>
  <p class="browser-note">사이트 화면을 클릭한 뒤 바로 입력하세요. 로그인 상태는 서버의 사용자별 브라우저에 저장됩니다.</p>
</section>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const site = {{ site|tojson }};
  const csrf = {{ csrf_token|tojson }};
  const screen = document.getElementById('browser-screen');
  const keyboard = document.getElementById('browser-keyboard');
  const message = document.getElementById('browser-message');
  const viewport = document.getElementById('browser-viewport');
  const cursor = document.getElementById('browser-cursor');
  let imageUrl;
  let revision;
  let running = true;
  let inputQueue = Promise.resolve();
  let textBuffer = '';
  let textTimer;
  let composing = false;
  let lastInteraction = Date.now();
  let firstFrame = true;

  async function command(action, data = {}) {
    const response = await fetch('/api/browser/' + action, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-TraceLens-CSRF': csrf},
      body: JSON.stringify({site, ...data}), cache: 'no-store',
    });
    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error || error.detail || '브라우저 연결에 실패했습니다.');
    }
    return response;
  }

  function send(action, data) {
    lastInteraction = Date.now();
    inputQueue = inputQueue.then(() => command('input', {action, ...data}))
      .catch(error => { message.textContent = error.message; });
    return inputQueue;
  }

  function flushText() {
    clearTimeout(textTimer);
    if (!textBuffer) return;
    const text = textBuffer;
    textBuffer = '';
    send('text', {text});
  }

  function addText(text) {
    if (!text) return;
    textBuffer += text;
    if (textBuffer.length >= 500) flushText();
    else { clearTimeout(textTimer); textTimer = setTimeout(flushText, 40); }
  }

  async function refresh() {
    if (!running) return;
    let unchanged = false;
    try {
      const response = await command('frame', {revision});
      unchanged = response.status === 204;
      if (response.status !== 204) {
        revision = response.headers.get('X-Frame-Revision');
        const next = URL.createObjectURL(await response.blob());
        const previous = imageUrl;
        screen.onload = () => {
          if (previous) URL.revokeObjectURL(previous);
          if (firstFrame) {
            firstFrame = false;
            if (viewport.getBoundingClientRect().bottom > window.innerHeight) {
              viewport.scrollIntoView({block: 'start', behavior: 'smooth'});
            }
          }
        };
        screen.src = next;
        screen.hidden = false;
        imageUrl = next;
      }
      message.textContent = '사이트 입력칸을 클릭하고 바로 입력하세요.';
    } catch (error) { message.textContent = error.message; }
    const active = Date.now() - lastInteraction < 3000;
    if (running) setTimeout(refresh, document.hidden ? 1800 : active ? 350 : unchanged ? 1100 : 600);
  }

  screen.addEventListener('pointermove', event => {
    const rect = screen.getBoundingClientRect();
    cursor.style.left = `${event.clientX - rect.left}px`;
    cursor.style.top = `${event.clientY - rect.top}px`;
    cursor.style.display = 'block';
  });
  screen.addEventListener('pointerleave', () => { cursor.style.display = 'none'; });
  screen.addEventListener('click', event => {
    const rect = screen.getBoundingClientRect();
    flushText();
    send('click', {x: Math.round((event.clientX - rect.left) * 1280 / rect.width),
                   y: Math.round((event.clientY - rect.top) * 800 / rect.height)});
    keyboard.focus({preventScroll: true});
  });
  screen.addEventListener('focus', () => keyboard.focus({preventScroll: true}));
  screen.addEventListener('wheel', event => {
    event.preventDefault();
    flushText();
    send('scroll', {y: event.deltaY});
  }, {passive: false});

  keyboard.addEventListener('compositionstart', () => { composing = true; });
  keyboard.addEventListener('compositionend', () => {
    composing = false;
    addText(keyboard.value);
    keyboard.value = '';
  });
  keyboard.addEventListener('input', () => {
    if (composing) return;
    addText(keyboard.value);
    keyboard.value = '';
  });
  keyboard.addEventListener('keydown', event => {
    let key = event.key;
    if ((event.ctrlKey || event.metaKey) && key.toLowerCase() === 'a') key = 'ControlOrMeta+A';
    if (!['Enter', 'Tab', 'Backspace', 'Delete', 'Escape', 'ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'ControlOrMeta+A'].includes(key)) return;
    event.preventDefault();
    if (composing && key === 'Enter') return;
    flushText();
    send('key', {key});
  });

  window.addEventListener('pagehide', () => {
    running = false;
    clearTimeout(textTimer);
    keyboard.value = '';
    if (imageUrl) URL.revokeObjectURL(imageUrl);
  });
  command('open').then(refresh).catch(error => { message.textContent = error.message; });
})();
</script>
{% endblock %}

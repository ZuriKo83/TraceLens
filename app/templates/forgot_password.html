{% extends "base.html" %}{% block title %}비밀번호 찾기 · {{ app_name }}{% endblock %}
{% block content %}<section class="auth-shell"><div class="auth-card"><p class="eyebrow">PASSWORD RESET</p><h1>비밀번호 찾기</h1>
<p class="muted">가입 이메일로 재설정 인증번호를 보냅니다.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/auth/password/request-code" class="stack-form"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label>이메일 주소<input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label><button class="button primary full" type="submit">인증번호 받기</button></form>
<a class="text-link" href="/login">로그인으로 돌아가기</a></div></section>{% endblock %}

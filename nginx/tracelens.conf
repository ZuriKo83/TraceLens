limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=collector:10m rate=30r/m;

upstream tracelens_app {
    server 127.0.0.1:8021;
    keepalive 32;
}

server {
    listen 80;
    server_name tracelens.kr www.tracelens.kr;
    client_max_body_size 5m;

    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://tracelens_app;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/collector/ {
        limit_req zone=collector burst=10 nodelay;
        proxy_pass http://tracelens_app;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://tracelens_app;
        include proxy_params;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
